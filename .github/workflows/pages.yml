name: Deploy demo site to GitHub Pages

# Builds a public demo from dummy example sessions (no personal data) and
# publishes it to GitHub Pages. Triggered on pushes to master/main and manual
# runs. Not on tag pushes (GitHub Pages env only accepts deploys from master,
# and the master push already covers the same content). Highlight.js loads
# client-side from CDN so no extra deps.

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install markdown

      - name: Scaffold wiki layout
        run: python -m sessionwiki init

      - name: Seed demo sessions (no real user data)
        run: |
          set -e
          mkdir -p raw/sessions
          # The demo corpus: synthetic sessions under examples/demo-sessions/
          # (tests/fixtures/ stay test-only, so the demo never shows stale fixtures).
          if [ -d examples/demo-sessions ] && [ "$(ls -A examples/demo-sessions 2>/dev/null)" ]; then
            cp -r examples/demo-sessions/* raw/sessions/
            echo "Seeded raw/sessions/ from examples/demo-sessions/"
          fi
          echo "--- raw/sessions contents ---"
          find raw/sessions -maxdepth 2 -type f | sort

      - name: Build static site
        run: python -m sessionwiki build --out ./site

      - name: Ensure .nojekyll for Pages
        run: touch ./site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
