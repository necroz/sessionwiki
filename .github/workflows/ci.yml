name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint-and-test:
    # Pinned: ubuntu-latest moved to 26.04, which has no Python 3.9 build
    # for actions/setup-python. Unpin when 3.9 leaves the matrix.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install required deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install markdown
          python -m pip install ruff pytest

      - name: Ruff lint
        run: |
          ruff check sessionwiki tests || true
          # Don't fail the build on warnings in v0.1

      - name: CLI smoke tests
        run: |
          python -m sessionwiki --version
          python -m sessionwiki adapters
          python -m sessionwiki init

      - name: Build smoke test with fixtures
        run: |
          python -m sessionwiki build --out ./ci-site || true
          test -f ./ci-site/style.css || echo "build produced no output (no fixtures yet — this is ok in v0.1)"

      - name: Run pytest
        run: |
          if [ -d tests ] && [ -n "$(find tests -name 'test_*.py' 2>/dev/null)" ]; then
            python -m pytest tests/ -q
          else
            echo "no tests yet — skipping"
          fi

      - name: Privacy grep (should return zero hits)
        run: |
          # Never commit the real username; the test fixtures use USER as placeholder
          if grep -rn "deepshikhasingh" --include="*.md" --include="*.py" --exclude-dir=".temp" --exclude-dir=".framework" --exclude-dir=".git" .; then
            echo "ERROR: real username leaked into committed files" >&2
            exit 1
          fi

  cross-platform:
    # E5: Windows/macOS breakage was the top reason users left claude-mem.
    # Same install and smoke steps as lint-and-test, plus the full suite.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install markdown pytest
          python -m pip install -e .

      - name: CLI smoke
        shell: bash
        run: |
          python -m sessionwiki --version
          python -m sessionwiki adapters
          python -m sessionwiki init
          python -m sessionwiki doctor

      - name: Tests
        shell: bash
        env:
          PYTHONUTF8: "1"
        # Timing-ratio perf tests are noisy on shared macOS/Windows
        # runners and fail on scheduling jitter, not on a regression.
        # They stay covered on Linux in lint-and-test.
        run: python -m pytest tests/ -q -m "not slow"

  performance-budget:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install markdown

      - name: Build against fixtures (when present)
        run: |
          python -m sessionwiki init
          if [ -d tests/fixtures/demo ]; then
            # Stage demo fixtures as if they'd been produced by `sessionwiki sync`.
            cp -a tests/fixtures/demo/. raw/sessions/
            time python -m sessionwiki build --out ./perf-site
            if [ ! -d ./perf-site ]; then
              echo "ERROR: build produced no output directory" >&2
              exit 1
            fi
            # Budget: build under 15 seconds, site under 50 MB
            SIZE=$(du -sb ./perf-site | cut -f1)
            MB=$((SIZE / 1024 / 1024))
            echo "site size: ${MB} MB"
            if [ "$MB" -gt 50 ]; then
              echo "ERROR: site size ${MB} MB exceeds 50 MB budget" >&2
              exit 1
            fi
          else
            echo "no demo fixtures yet — skipping perf budget check"
          fi
