name: Link check

# Scans README, CHANGELOG, docs/, and examples/ for broken external links.
# Runs weekly on Sunday 03:00 UTC, on push to master when link-heavy files
# change, and on manual dispatch. Internal links in site/ have a separate
# checker (sessionwiki check-links) that runs on build.

on:
  schedule:
    - cron: "0 3 * * 0"
  push:
    branches: ["master"]
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "docs/**/*.md"
      - "examples/**/*.md"
      - "lychee.toml"
      - ".github/workflows/link-check.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Serialise runs: a push and a scheduled run can otherwise both look for
# the tracking issue before either has created it.
concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  link-check:
    name: Lychee external link scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Scan only the docs/content surface — exclude paths in lychee.toml
          args: >-
            --config lychee.toml
            --cache
            README.md
            CHANGELOG.md
            CONTRIBUTING.md
            'docs/**/*.md'
            'examples/**/*.md'
          fail: false  # Don't fail the workflow; file an issue instead
          output: lychee-report.md

      - name: Find the open tracking issue
        id: tracking
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq 'map(select(.title == "Broken external links detected")) | first | .number // ""')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Create or update tracking issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Broken external links detected"
          content-filepath: lychee-report.md
          labels: docs, chore
          # The action has no title-matching mode: without an explicit
          # issue-number it always creates a new issue. Reuse the open
          # tracking issue so each run refreshes its report.
          issue-number: ${{ steps.tracking.outputs.number }}

      - name: Close the tracking issue when the check is clean
        if: steps.lychee.outputs.exit_code == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq '.[] | select(.title == "Broken external links detected") | .number' |
          while read -r number; do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "All checked links resolve again as of ${GITHUB_SHA:0:7}."
          done
