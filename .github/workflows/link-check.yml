name: Link check

# Scans README, CHANGELOG, docs/, and examples/ for broken external links.
# Runs weekly on Sunday 03:00 UTC, on push to master when link-heavy files
# change, and on manual dispatch. Internal links in site/ have a separate
# checker (sessionwiki check-links) that runs on build.

on:
  schedule:
    - cron: "0 3 * * 0"
  push:
    branches: ["master"]
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "docs/**/*.md"
      - "examples/**/*.md"
      - "lychee.toml"
      - ".github/workflows/link-check.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Serialise runs: a push and a scheduled run can otherwise both look for
# the tracking issue before either has created it.
concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  link-check:
    name: Lychee external link scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      # Install lychee directly instead of through lycheeverse/lychee-action:
      # the action downloads the binary with a bare `curl -sfLO` and no
      # retry, so one transient GitHub HTTP error kills the job before any
      # link is checked (run 42468951917, 2026-11-08: curl exit 22).
      # The download goes through the authenticated API because public
      # releases/download URLs answer 504 to anonymous clients during
      # GitHub degradations (2026-11-08 incident, reproduced 2026-11-09).
      - name: Install lychee
        env:
          LYCHEE_VERSION: v0.24.2
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="lychee-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/${archive}"
          mkdir -p "$RUNNER_TEMP/lychee/bin"
          downloaded=false
          for attempt in 1 2 3 4 5; do
            # Authenticated API first: the public URL answers 504 to
            # anonymous clients during GitHub incidents.
            if gh release download "lychee-${LYCHEE_VERSION}" \
                 --repo lycheeverse/lychee \
                 --pattern "$archive" \
                 --dir "$RUNNER_TEMP/lychee" \
                 --clobber; then
              downloaded=true
              break
            fi
            if curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 \
                 -o "$RUNNER_TEMP/lychee/$archive" "$url"; then
              downloaded=true
              break
            fi
            echo "download attempt ${attempt} failed; retrying in 10s" >&2
            sleep 10
          done
          if [ "$downloaded" != true ]; then
            echo "could not download lychee ${LYCHEE_VERSION}" >&2
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/lychee/$archive" -C "$RUNNER_TEMP/lychee"
          install -m 0755 "$RUNNER_TEMP"/lychee/lychee-*/lychee "$RUNNER_TEMP/lychee/bin/lychee"
          echo "$RUNNER_TEMP/lychee/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/lychee/bin/lychee" --version

      - name: Run lychee
        id: lychee
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          lychee \
            --config lychee.toml \
            --cache \
            --format markdown \
            --output lychee-report.md \
            README.md \
            CHANGELOG.md \
            CONTRIBUTING.md \
            'docs/**/*.md' \
            'examples/**/*.md'
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "lychee exit code: $code"
          # 0 = clean; 2 = broken links (reported through the tracking issue
          # below). 1 and 3 mean lychee itself could not run — fail loudly
          # instead of silently skipping the check.
          case "$code" in
            0|2) exit 0 ;;
            *) echo "lychee failed to run (exit ${code})" >&2; exit 1 ;;
          esac

      # 5xx responses are remote-server errors, not dead links. During a
      # GitHub incident every github.com URL answers 504, and filing an
      # issue for that is noise (issue #38, 2026-11-09).
      - name: Classify failures
        id: classify
        if: steps.lychee.outputs.exit_code != 0
        run: |
          codes=$(grep -oE '^\* \[[0-9]{3}\]' lychee-report.md | grep -oE '[0-9]{3}' || true)
          infra=false
          if [ -n "$codes" ]; then
            infra=true
            for code in $codes; do
              case "$code" in
                5*) ;;
                *) infra=false ;;
              esac
            done
          fi
          echo "infra=$infra" >> "$GITHUB_OUTPUT"
          if [ "$infra" = true ]; then
            echo "::warning::All link failures are 5xx remote-server errors; not filing an issue."
          fi

      - name: Find the open tracking issue
        id: tracking
        if: steps.lychee.outputs.exit_code != 0 && steps.classify.outputs.infra != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq 'map(select(.title == "Broken external links detected")) | first | .number // ""')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Create or update tracking issue on broken links
        if: steps.lychee.outputs.exit_code != 0 && steps.classify.outputs.infra != 'true'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Broken external links detected"
          content-filepath: lychee-report.md
          labels: docs, chore
          # The action has no title-matching mode: without an explicit
          # issue-number it always creates a new issue. Reuse the open
          # tracking issue so each run refreshes its report.
          issue-number: ${{ steps.tracking.outputs.number }}

      - name: Close the tracking issue when the check is clean
        if: steps.lychee.outputs.exit_code == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq '.[] | select(.title == "Broken external links detected") | .number' |
          while read -r number; do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "All checked links resolve again as of ${GITHUB_SHA:0:7}."
          done
